<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa</title>
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1D252D; --muted:#66707A; --line:#DDE2DF;
  --compra:#4F7D3B; --calendario:#C8322B; --recetas:#94770A;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tap:2.75rem; --e2:1rem; --e3:1.5rem;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12161A; --surface:#1B2127; --ink:#E6EAED; --muted:#98A2AC; --line:#2C343C;
         --compra:#8DB86F; --calendario:#E5534B; --recetas:#D7B93E; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--body);-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--calendario);outline-offset:3px;border-radius:.5rem}
main{max-width:34rem;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--e3)) var(--e2) var(--e3)}
h1{font:700 2.6rem/1 var(--display);margin:0 0 .25rem}
.sub{color:var(--muted);margin:0 0 var(--e3)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
a.app{display:grid;grid-template-columns:3rem 1fr;gap:var(--e2);align-items:center;text-decoration:none;color:inherit;
      background:var(--surface);border:1px solid var(--line);border-radius:.875rem;padding:var(--e2);min-height:var(--tap)}
.ico{width:3rem;height:3rem;border-radius:.75rem;display:grid;place-items:center;background:var(--c);color:#fff}
.ico svg{width:1.6rem;height:1.6rem}
.nom{display:block;font:600 1.45rem/1.1 var(--display)}
.des{display:block;color:var(--muted);font-size:.9rem}
footer{color:var(--muted);font-size:.85rem;margin-top:var(--e3)}
</style>
</head>
<body>
<main>
  <h1>Casa</h1>
  <p class="sub">Las tres aplicaciones, en el mismo sitio.</p>
  <ul>
    <li><a class="app" href="compra/">
      <span class="ico" style="--c:var(--compra)" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.4-1.1L20.5 8H6.1"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>
      <span><span class="nom">La compra</span><span class="des">Lista semanal y productos habituales</span></span></a></li>
    <li><a class="app" href="calendario/">
      <span class="ico" style="--c:var(--calendario)" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
      <span><span class="nom">Calendario</span><span class="des">Citas, fechas señaladas y menú de la semana</span></span></a></li>
    <li><a class="app" href="recetas/">
      <span class="ico" style="--c:var(--recetas)" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2.5 2.5 0 0 0 5 0V3M8.5 10v11M17.5 3c-1.4 1.6-2 3.4-2 5.5 0 1.6.7 2.6 2 3V21"/></svg></span>
      <span><span class="nom">Recetas</span><span class="des">El recetario y el modo paso a paso</span></span></a></li>
  </ul>
  <footer>Para usarlas a diario, añade cada una a la pantalla de inicio desde su propia página.</footer>
</main>
</body>
</html>
